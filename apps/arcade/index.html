<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wattcade</title>
    <style>
      /*
        A bike computer, not a games portal. Near-black ground, one text
        colour, figures in tabular numerals so nothing jitters as it counts,
        and no colour of its own beyond the state colours — the games bring
        the colour, through the swatch on each card.
      */
      :root {
        color-scheme: dark;
        --ground: #0b0d10;
        --surface: #12161b;
        --surface-lift: #171c22;
        --line: rgba(232, 230, 225, 0.1);
        --line-strong: rgba(232, 230, 225, 0.2);
        --text: #e8e6e1;
        --dim: rgba(232, 230, 225, 0.62);
        --faint: rgba(232, 230, 225, 0.38);
        --warn: #e0a756;
        --bad: #e0614a;
        --good: #7fd88f;
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--ground);
        color: var(--text);
        font: 400 16px/1.55 var(--sans);
        overflow: hidden;
      }

      canvas { display: block; }

      #overlay {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        background: var(--ground);
      }
      #overlay[hidden] { display: none; }

      .sheet {
        max-width: 72rem;
        margin: 0 auto;
        padding: 4rem 2rem 6rem;
      }
      .sheet.card-only {
        min-height: 100%;
        display: grid;
        place-items: center;
        /* The last frame of the run stays visible behind the card. */
        background: rgba(11, 13, 16, 0.86);
      }
      #overlay:has(.card-only) { background: transparent; }

      /* --- masthead -------------------------------------------------- */

      .masthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1.5rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--line);
        margin-bottom: 2.5rem;
      }
      .masthead h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .ridden {
        margin: 0;
        font: 500 0.875rem var(--mono);
        font-variant-numeric: tabular-nums;
        color: var(--dim);
      }

      /* --- panels ---------------------------------------------------- */

      .panels { display: grid; gap: 1.25rem; align-items: start; }
      @media (min-width: 62rem) {
        .panels { grid-template-columns: 1fr 1fr; }
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1.5rem 1.75rem;
      }

      .k {
        margin: 0 0 0.75rem;
        font: 600 0.6875rem var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .trainer { border-left: 3px solid var(--faint); }
      .trainer[data-mode="controls"] { border-left-color: var(--good); }
      .trainer[data-mode="readonly"],
      .trainer[data-mode="keyboard"] { border-left-color: var(--warn); }
      .trainer[data-mode="lost"] { border-left-color: var(--bad); }
      .trainer[data-mode="connecting"] { border-left-color: var(--line-strong); }

      .trainer .headline {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .trainer .detail { margin: 0.375rem 0 0; color: var(--dim); }
      .trainer .actions { margin: 1.25rem 0 0; display: flex; gap: 0.625rem; flex-wrap: wrap; }

      .fine {
        margin: 1rem 0 0;
        font-size: 0.8125rem;
        line-height: 1.6;
        color: var(--faint);
        max-width: 48rem;
      }
      .footer { margin-top: 2.5rem; }

      /* --- the rider's numbers --------------------------------------- */

      .fields { display: flex; gap: 1.75rem; flex-wrap: wrap; }
      .fields label {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .fields label > span {
        font: 600 0.6875rem var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
        min-width: 3.5rem;
      }
      .fields em {
        font-style: normal;
        font: 500 0.8125rem var(--mono);
        color: var(--faint);
      }
      .fields input {
        width: 5.5rem;
        background: var(--ground);
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 0.5rem 0.625rem;
        color: var(--text);
        font: 600 1.125rem var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .fields input:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }

      /* --- buttons --------------------------------------------------- */

      button {
        font: 500 0.9375rem var(--sans);
        padding: 0.625rem 1.125rem;
        border-radius: 6px;
        border: 1px solid var(--line-strong);
        background: var(--surface-lift);
        color: var(--text);
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #1e242b; border-color: var(--text); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button.go { background: var(--text); color: var(--ground); border-color: var(--text); font-weight: 600; }
      button.go:hover:not(:disabled) { background: #fff; color: var(--ground); }
      button.ghost { background: transparent; }

      /* --- the games ------------------------------------------------- */

      .games {
        display: grid;
        gap: 1.25rem;
        margin-top: 2rem;
      }
      @media (min-width: 62rem) {
        .games { grid-template-columns: repeat(3, 1fr); align-items: start; }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      /* The hub has no palette of its own; each card wears the game's. */
      .swatch { display: flex; height: 5px; }
      .swatch i { flex: 1; }
      .swatch i:nth-child(1) { background: var(--base); flex: 2; }
      .swatch i:nth-child(2) { background: var(--accent); }
      .swatch i:nth-child(3) { background: var(--detail); }

      .card-body { padding: 1.5rem 1.5rem 1.75rem; }
      .card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .blurb { margin: 0 0 1rem; color: var(--dim); font-size: 0.9375rem; }

      .warn {
        margin: 0 0 1rem;
        padding: 0.625rem 0.75rem;
        border-left: 2px solid var(--warn);
        background: rgba(224, 167, 86, 0.08);
        color: var(--warn);
        font-size: 0.8125rem;
        line-height: 1.5;
      }

      .controls, .record {
        margin: 0 0 0.375rem;
        font: 400 0.75rem var(--mono);
        font-variant-numeric: tabular-nums;
        color: var(--faint);
        line-height: 1.6;
      }
      .record { margin-bottom: 1.25rem; color: var(--dim); }

      .start { display: flex; gap: 0.625rem; align-items: flex-end; flex-wrap: wrap; }
      .seed { display: flex; flex-direction: column; gap: 0.375rem; flex: 1 1 10rem; }
      .seed span {
        font: 600 0.6875rem var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .seed input {
        background: var(--ground);
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 0.5rem 0.625rem;
        color: var(--text);
        font: 400 0.875rem var(--mono);
        width: 100%;
      }

      /* --- a ladder -------------------------------------------------- */

      .variants { display: grid; gap: 0.5rem; }
      .variant {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.125rem 0.75rem;
        text-align: left;
        padding: 0.75rem 0.875rem;
        background: transparent;
        border-color: var(--line);
      }
      .variant-name {
        font: 600 0.9375rem var(--sans);
        grid-column: 1;
      }
      .variant-detail {
        grid-column: 1 / -1;
        font-size: 0.8125rem;
        color: var(--dim);
        line-height: 1.5;
      }
      .variant-note {
        grid-column: 1 / -1;
        font: 400 0.75rem var(--mono);
        color: var(--faint);
        line-height: 1.6;
        margin-top: 0.25rem;
      }
      .variant-mark {
        grid-column: 2;
        grid-row: 1;
        font: 600 0.625rem var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        align-self: center;
      }
      .variant.cleared { border-color: var(--line-strong); }
      .variant.cleared .variant-mark { color: var(--good); }

      /* --- results --------------------------------------------------- */

      .results {
        width: min(34rem, 100%);
        background: var(--surface);
        border: 1px solid var(--line);
        border-top: 3px solid var(--accent);
        border-radius: 10px;
        padding: 2rem 2rem 2.25rem;
      }
      .results .headline {
        margin: 0;
        font-size: 3.25rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        line-height: 1.05;
      }
      .results .summary { margin: 0.5rem 0 1.75rem; color: var(--dim); }
      .rows { margin: 0 0 1.75rem; display: grid; gap: 0; }
      .rows > div {
        display: flex;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--line);
      }
      .rows dt {
        font: 600 0.6875rem var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        white-space: nowrap;
        padding-top: 0.2rem;
      }
      .rows dd {
        margin: 0;
        font: 500 0.875rem var(--mono);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .results .actions { margin: 0; display: flex; gap: 0.625rem; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <div class="sheet hub" id="sheet"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
